[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-frame"
version = "0.1.0"
description = "FlashFrame — encode images into brightness flashes and decode them back (optical transfer)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Charles Miedema" }]
keywords = ["optical", "camera", "flash", "image-transfer", "manchester"]
dependencies = [
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
webcam = ["opencv-python-headless>=4.8.0"]

[project.scripts]
flashframe = "flashframe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flashframe = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
